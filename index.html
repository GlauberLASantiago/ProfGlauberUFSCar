<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Dados - Supabase (Modo Debug)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px;
        }
        button { 
            padding: 10px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #login-btn { background-color: #4285F4; color: white; font-weight: bold; }
        #logout-btn { background-color: #d9534f; color: white; }
        #salvar-btn { background-color: #28a745; color: white; }
        
        #profile-section, #app-section { display: none; }
        img { border-radius: 50%; width: 50px; height: 50px; vertical-align: middle; margin-right: 10px; }
        
        /* CAIXA DE DEBUG */
        #debug-box {
            background-color: #1e1e1e;
            color: #00ff00;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Meu App com Banco de Dados</h2>

    <div id="login-section">
        <p>Faça login para salvar dados</p>
        <button id="login-btn" onclick="loginComGoogle()">Entrar com o Google</button>
    </div>

    <div id="profile-section">
        <hr>
        <p style="display: flex; align-items: center;">
            <img id="user-avatar" src="" alt="Avatar">
            <strong id="user-name"></strong>
        </p>
        <button id="logout-btn" onclick="logout()">Sair da Conta</button>
        <hr>
    </div>

    <div id="app-section">
        <h3>Nova Mensagem</h3>
        <input type="text" id="texto-mensagem" placeholder="Digite algo para salvar...">
        <button id="salvar-btn" onclick="salvarDados()">Salvar no Supabase</button>
        <div id="lista-mensagens" style="margin-top:15px;">Carregando...</div>
    </div>
</div>

<div id="debug-box">
    <strong>RAIO-X DO SISTEMA:</strong><br>
</div>

<script>
    // FUNÇÃO QUE ESCREVE NA TELA
    function registrarAviso(mensagem) {
        const debugBox = document.getElementById('debug-box');
        debugBox.innerHTML += `> ${mensagem}<br>`;
        console.log("DEBUG:", mensagem);
    }

    registrarAviso("1. Lendo o script HTML...");

    // 1. CHAVES DO SUPABASE
    const SUPABASE_URL = 'https://outafyuukzxqhqvnkjva.supabase.co';
    const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_CHAVE_ANON_LONGA_QUE_COMECA_COM_eyJ';

    let supabase;
    let usuarioAtual = null;

    try {
        registrarAviso("2. Tentando conectar com o Supabase...");
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        registrarAviso("3. Conexão criada com sucesso!");
    } catch (erro) {
        registrarAviso("ERRO FATAL NA CONEXÃO: " + erro.message);
    }

    // --- FUNÇÕES DE AUTENTICAÇÃO ---
    async function loginComGoogle() {
        registrarAviso("-> BOTÃO CLICADO: Iniciando loginComGoogle()...");
        try {
            const { data, error } = await supabase.auth.signInWithOAuth({ 
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
            
            if (error) {
                registrarAviso("ERRO AO LOGAR: " + error.message);
            } else {
                registrarAviso("-> Redirecionando para a tela do Google...");
            }
        } catch (erro) {
            registrarAviso("ERRO INESPERADO NO LOGIN: " + erro.message);
        }
    }

    async function logout() {
        registrarAviso("-> BOTÃO SAIR CLICADO");
        await supabase.auth.signOut();
    }

    // Monitora o usuário
    registrarAviso("4. Ativando monitoramento de sessão...");
    supabase.auth.onAuthStateChange((event, session) => {
        registrarAviso(`MUDANÇA DE ESTADO: Evento disparado -> [${event}]`);
        
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const appSection = document.getElementById('app-section');

        if (session && session.user) {
            registrarAviso("-> Usuário ENCONTRADO e logado!");
            usuarioAtual = session.user;
            loginSection.style.display = 'none';
            profileSection.style.display = 'block';
            appSection.style.display = 'block';

            const meta = session.user.user_metadata;
            document.getElementById('user-name').innerText = meta.full_name || 'Usuário';
            document.getElementById('user-avatar').src = meta.avatar_url || '';
            
            carregarDados();
        } else {
            registrarAviso("-> Nenhum usuário logado no momento.");
            usuarioAtual = null;
            loginSection.style.display = 'block';
            profileSection.style.display = 'none';
            appSection.style.display = 'none';
        }
    });

    // --- FUNÇÕES DE BANCO DE DADOS ---
    async function salvarDados() {
        const input = document.getElementById('texto-mensagem');
        const texto = input.value;
        if (!texto) return alert('Digite algo!');

        registrarAviso("-> Tentando salvar mensagem no banco...");
        const { error } = await supabase.from('TESTE1_mensagens').insert([{ user_id: usuarioAtual.id, texto: texto }]);

        if (error) {
            registrarAviso("ERRO AO SALVAR: " + error.message);
        } else {
            registrarAviso("-> Mensagem salva com sucesso!");
            input.value = '';
            carregarDados();
        }
    }

    async function carregarDados() {
        registrarAviso("-> Puxando mensagens do banco...");
        const divLista = document.getElementById('lista-mensagens');
        divLista.innerHTML = 'Carregando...';

        const { data, error } = await supabase.from('TESTE1_mensagens').select('*').order('criado_em', { ascending: false });

        if (error) {
            registrarAviso("ERRO AO CARREGAR: " + error.message);
            divLista.innerHTML = 'Erro ao carregar dados.';
            return;
        }

        registrarAviso(`-> ${data.length} mensagens carregadas.`);
        divLista.innerHTML = '';
        if (data.length === 0) divLista.innerHTML = 'Nenhuma mensagem.';
        else data.forEach(item => {
            const divItem = document.createElement('div');
            divItem.className = 'mensagem-item';
            divItem.innerText = item.texto;
            divLista.appendChild(divItem);
        });
    }
</script>

</body>
</html>
