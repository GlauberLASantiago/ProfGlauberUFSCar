<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Dados - Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px;
        }
        button { 
            padding: 10px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #login-btn { background-color: #4285F4; color: white; font-weight: bold; }
        #logout-btn { background-color: #d9534f; color: white; }
        #salvar-btn { background-color: #28a745; color: white; }
        
        #profile-section, #app-section { display: none; }
        img { border-radius: 50%; width: 50px; height: 50px; vertical-align: middle; margin-right: 10px; }
        
        .mensagem-item {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Meu App com Banco de Dados</h2>

    <div id="login-section">
        <p>Faça login para salvar dados</p>
        <button id="login-btn" onclick="loginComGoogle()">Entrar com o Google</button>
    </div>

    <div id="profile-section">
        <hr>
        <p style="display: flex; align-items: center;">
            <img id="user-avatar" src="" alt="Avatar">
            <strong id="user-name"></strong>
        </p>
        <button id="logout-btn" onclick="logout()">Sair da Conta</button>
        <hr>
    </div>

    <div id="app-section">
        <h3>Nova Mensagem</h3>
        <input type="text" id="texto-mensagem" placeholder="Digite algo para salvar...">
        <button id="salvar-btn" onclick="salvarDados()">Salvar no Supabase</button>
        
        <h3>Mensagens Salvas:</h3>
        <div id="lista-mensagens">Carregando...</div>
    </div>
</div>

<script>
    // 1. CHAVES DO SUPABASE
    const SUPABASE_URL = 'https://outafyuukzxqhqvnkjva.supabase.co';
    // Cole abaixo a sua chave anon longa que começa com eyJ...
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91dGFmeXV1a3p4cWhxdm5ranZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTI0NDgsImV4cCI6MjA5MTA2ODQ0OH0.N913EFYb6PYefFyn0kDYtx7L9jt-l3EBVA_G9l-eimM';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let usuarioAtual = null;

    // --- FUNÇÕES DE AUTENTICAÇÃO ---
    async function loginComGoogle() {
        await supabase.auth.signInWithOAuth({ provider: 'google' });
    }

    async function logout() {
        await supabase.auth.signOut();
    }

    // Monitora se o usuário está logado ou não
    supabase.auth.onAuthStateChange((event, session) => {
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const appSection = document.getElementById('app-section');

        if (session && session.user) {
            usuarioAtual = session.user; // Guarda os dados do usuário logado
            loginSection.style.display = 'none';
            profileSection.style.display = 'block';
            appSection.style.display = 'block';

            // Preenche o nome e a foto vindos do Google
            const meta = session.user.user_metadata;
            document.getElementById('user-name').innerText = meta.full_name || 'Usuário';
            document.getElementById('user-avatar').src = meta.avatar_url || '';
            
            carregarDados(); // Carrega as mensagens do banco
        } else {
            usuarioAtual = null;
            loginSection.style.display = 'block';
            profileSection.style.display = 'none';
            appSection.style.display = 'none';
        }
    });

    // --- FUNÇÕES DE BANCO DE DADOS ---

    // Função para INSERIR dados na tabela TESTE1_mensagens
    async function salvarDados() {
        const input = document.getElementById('texto-mensagem');
        const texto = input.value;

        if (!texto) {
            alert('Digite alguma coisa antes de salvar!');
            return;
        }

        const { error } = await supabase
            .from('TESTE1_mensagens')
            .insert([
                { user_id: usuarioAtual.id, texto: texto }
            ]);

        if (error) {
            console.error('Erro ao salvar:', error);
            alert('Erro ao salvar: ' + error.message);
        } else {
            input.value = ''; // Limpa a caixa de texto
            carregarDados();  // Recarrega a lista para mostrar a mensagem nova
        }
    }

    // Função para LER dados da tabela TESTE1_mensagens
    async function carregarDados() {
        const divLista = document.getElementById('lista-mensagens');
        divLista.innerHTML = 'Carregando...';

        const { data, error } = await supabase
            .from('TESTE1_mensagens')
            .select('*')
            .order('criado_em', { ascending: false });

        if (error) {
            console.error('Erro ao buscar:', error);
            divLista.innerHTML = 'Erro ao carregar dados.';
            return;
        }

        divLista.innerHTML = '';
        if (data.length === 0) {
            divLista.innerHTML = 'Nenhuma mensagem salva ainda.';
        } else {
            data.forEach(item => {
                const divItem = document.createElement('div');
                divItem.className = 'mensagem-item';
                divItem.innerText = item.texto;
                divLista.appendChild(divItem);
            });
        }
    }
</script>

</body>
</html>
